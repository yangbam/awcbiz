<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원정보 | AWC기업인연합회</title>
<meta name="description" content="물 인프라 구축과 미래 도시 설계를 이끌어가는 AWC기업인연합회 핵심 파트너 회원사를 소개합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="navbar__inner">
    <a href="index.html" class="navbar__logo"><img src="img/협회로고.png" alt="AWC기업인연합회" class="navbar__logo-img"></a>
    <nav class="navbar__links" data-nav-menu>
      <a href="index.html" class="navbar__link">협회소개</a>
      <a href="members.html" class="navbar__link is-active">회원정보</a>
      <a href="activities.html" class="navbar__link">활동이력</a>
    </nav>
    <div class="navbar__actions">
      <a href="join.html" class="btn btn-primary">회원신청</a>
      <button class="navbar__toggle" type="button" data-nav-toggle aria-label="메뉴 열기" aria-expanded="false">
        <span data-icon="menu"></span>
      </button>
    </div>
  </div>
  <nav class="navbar__mobile-menu" data-nav-menu>
    <a href="index.html" class="navbar__link">협회소개</a>
    <a href="members.html" class="navbar__link is-active">회원정보</a>
    <a href="activities.html" class="navbar__link">활동이력</a>
  </nav>
</header>

<main>
  <section class="page-header-band page-header-band--mid">
    <div class="page-header-band__bg" style="background-image: url('img/회원정보.png');" role="img" aria-label="AWC기업인연합회 회원사 수처리 시설 전경"></div>
    <div class="container text-center">
      <h1 class="headline-xl" style="margin-bottom: var(--stack-md); color: var(--on-primary);">협회와 함께하는 기업 회원</h1>
      <div style="display:flex; flex-direction: column; gap: 20px; align-items:center;">
        <p class="body-lg max-w-prose" style="color: rgba(255,255,255,0.88); margin: 0 auto;">
          물 인프라 구축과 미래 도시 설계를 이끌어가는 핵심 파트너들을 소개합니다.<br>투명하고 전문적인 네트워크를 통해 지속 가능한 발전을 도모합니다.
        </p>
        <div class="count-badge label-md">
          <span>총 회원사</span>
          <strong data-member-total>0</strong>
        </div>
      </div>
    </div>
    <div class="wave-divider" aria-hidden="true">
      <svg viewBox="0 0 1440 100" preserveAspectRatio="none"><path d="M0,48 C240,10 480,80 720,40 C960,0 1200,90 1440,32 L1440,100 L0,100 Z" fill="var(--background)"></path></svg>
    </div>
  </section>

  <section class="container" style="margin-bottom: var(--section-gap);">
    <div class="filter-panel" data-reveal>
      <div class="filter-grid">
        <div class="field">
          <label for="member-search">통합 검색</label>
          <div class="field-input-wrap">
            <span data-icon="search"></span>
            <input type="text" id="member-search" class="input" placeholder="기업명, 대표자, 또는 전문분야 검색..." data-member-search>
          </div>
        </div>
        <div class="field">
          <label for="category-filter">전문 분야 필터</label>
          <div class="field-input-wrap">
            <select id="category-filter" class="input" data-member-category>
              <option value="all">전체 (All)</option>
              <option value="engineering">엔지니어링 부문 (Engineering)</option>
              <option value="solution">솔루션 부문 (Solution)</option>
              <option value="operations">운영관리 부문 (Operations &amp; Management)</option>
            </select>
            <span data-icon="chevron-down"></span>
          </div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button type="button" class="btn btn-primary btn-block" data-member-apply>검색 적용</button>
        </div>
      </div>
      <div class="tag-row">
        <button type="button" class="tag-btn is-active" data-member-tag="all">전체</button>
        <button type="button" class="tag-btn" data-member-tag="engineering">엔지니어링 부문</button>
        <button type="button" class="tag-btn" data-member-tag="solution">솔루션 부문</button>
        <button type="button" class="tag-btn" data-member-tag="operations">운영관리 부문</button>
      </div>
    </div>
  </section>

  <section class="container" style="margin-bottom: var(--section-gap);">
    <div class="grid grid-members" data-member-grid>
      <!-- Rendered dynamically by js/main.js from js/data.js (DataStore) -->
    </div>

    <div class="empty-state" data-member-empty>
      <span data-icon="search" class="empty-state__icon"></span>
      <p class="body-md">검색 조건에 맞는 회원사가 없습니다.</p>
    </div>

    <div class="pagination" data-pagination></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div>
      <div class="site-footer__brand">AWC기업인연합회</div>
      <p class="site-footer__desc">© 2026 AWC기업인연합회. All rights reserved.</p>
      <p class="site-footer__desc">AWC기업인연합회 사무국 대표메일: <a href="mailto:awcbiz@awcbiz.org">awcbiz@awcbiz.org</a></p>
    </div>
    <div class="site-footer__links">
      <a href="terms.html">이용약관</a>
      <a href="privacy.html">개인정보처리방침</a>
      <a href="#" data-inquiry-open>문의하기</a>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
